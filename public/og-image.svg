<svg width="1200" height="630" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d2d2d;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="630" fill="url(#bgGradient)"/>
  
  <!-- Accent line -->
  <line x1="0" y1="80" x2="1200" y2="80" stroke="#ccff00" stroke-width="4"/>
  
  <!-- Main title -->
  <text x="60" y="150" font-family="Arial, sans-serif" font-size="72" font-weight="bold" fill="#ffffff" letter-spacing="-2">
    Underrated AI Atlas
  </text>
  
  <!-- Subtitle -->
  <text x="60" y="220" font-family="Arial, sans-serif" font-size="36" fill="#ccff00" font-weight="600">
    Interactive Directory of Hidden-Gem AI Models
  </text>
  
  <!-- Description -->
  <text x="60" y="290" font-family="Arial, sans-serif" font-size="28" fill="#b0b0b0">
    Explore 50+ underrated open-source, enterprise &amp; edge AI models.
  </text>
  <text x="60" y="330" font-family="Arial, sans-serif" font-size="28" fill="#b0b0b0">
    Compare parameters, browse architectures, deploy instantly.
  </text>
  
  <!-- Bottom accent bar with features -->
  <rect x="0" y="450" width="1200" height="180" fill="#0d0d0d" opacity="0.8"/>
  
  <!-- Feature badges -->
  <g font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#ccff00">
    <text x="80" y="510">✓ Real-Time Search</text>
    <text x="80" y="555">✓ One-Click Deployment</text>
    <text x="80" y="600">✓ Python • CLI • REST API</text>
    
    <text x="650" y="510">✓ 6 Categories</text>
    <text x="650" y="555">✓ Architecture Comparison</text>
    <text x="650" y="600">✓ Open Source Models</text>
  </g>
  
  <!-- Logo/Icon area -->
  <circle cx="1100" cy="120" r="50" fill="#ccff00" opacity="0.1" stroke="#ccff00" stroke-width="2"/>
  <text x="1070" y="140" font-size="60">🗺️</text>
</svg>